name: Build Scuttle for Windows, Linux and MacOS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package: Windows
          - os: ubuntu-latest
            package: Linux
          - os: macos-latest
            package: macOS

    runs-on: ${{ matrix.os }}

    steps:
      - name: Get source code
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build Maven project
        run: mvn --batch-mode clean package

      - name: Prepare application JAR
        shell: bash
        run: |
          mkdir -p package-input
          cp target/scuttle-1.0-SNAPSHOT.jar package-input/

      - name: Package application
        run: >
          jpackage
          --type app-image
          --name Scuttle
          --input package-input
          --main-jar scuttle-1.0-SNAPSHOT.jar
          --main-class scuttle.view.Scuttle
          --dest dist

      - name: Create Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Scuttle -DestinationPath Scuttle-Windows.zip

      - name: Create Linux archive
        if: runner.os == 'Linux'
        run: tar -czf Scuttle-Linux.tar.gz -C dist Scuttle
        
      - name: Create macOS ZIP
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Scuttle.app Scuttle-macOS.zip
        
      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: Scuttle-Windows
          path: Scuttle-Windows.zip
          if-no-files-found: error

      - name: Upload Linux package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: Scuttle-Linux
          path: Scuttle-Linux.tar.gz
          if-no-files-found: error
          
      - name: Upload Windows package
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: Scuttle-macOS
          path: Scuttle-macOS.zip
          if-no-files-found: error
